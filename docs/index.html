    <script>
      // Companion to public/404.html (GitHub Pages only): decodes the path that was
      // encoded as a query string and restores it before React Router boots.
      // Harmless on AWS, where CloudFront serves index.html for every route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(null, null, decoded[0] + (decoded[1] ? '&' + decoded[1] : '') + l.hash);
        }
      })(window.location);
    </script>
