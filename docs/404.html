<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nelson Torres</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // When GH Pages 404s on a client-side route, this page encodes the path
    // as a query string and sends the browser back to index.html, which then
    // restores it via the script in index.html.
    // segmentCount = 0 for user/org pages (username.github.io with no repo subpath)
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
