AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Laplacian GLM simulation backend — S3 data store, Lambda compute, HTTP API Gateway.
  Deploy this first, then run aws/scripts/build_layer.sh and aws/scripts/deploy_lambda.sh.

Parameters:
  BucketName:
    Type: String
    Default: laplacian-glm-data
    Description: >
      S3 bucket for precomputed matrices (X, Y, evals, evecs, L, contrast vectors).
      Must be globally unique — change the default if it is already taken.

Resources:

  # ---------------------------------------------------------------------------
  # S3 — precomputed data store
  # ---------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # IAM — Lambda execution role
  # ---------------------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LaplacianGLMLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}/data/*'
                  - !Sub 'arn:aws:s3:::${BucketName}/data_multi/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${BucketName}/renders/*'
        - PolicyName: SelfInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:laplacian-glm'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  # ---------------------------------------------------------------------------
  # Lambda — Python compute function
  # Layers are attached after deploy via aws/scripts/deploy_lambda.sh
  # ---------------------------------------------------------------------------
  LaplacianGLMFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: laplacian-glm
      PackageType: Image
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/laplacian-glm:latest'
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 2048
      Timeout: 120
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName

  # ---------------------------------------------------------------------------
  # API Gateway — HTTP API (v2) with CORS
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: laplacian-glm-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - 'https://nelsontorresjr330.github.io'
          - 'http://localhost:3000'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 300

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub >-
        arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LaplacianGLMFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  RunRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /run'
      Target: !Sub 'integrations/${LambdaIntegration}'

  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /status/{jobId}'
      Target: !Sub 'integrations/${LambdaIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # Allow API Gateway to invoke the Lambda
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LaplacianGLMFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

# ---------------------------------------------------------------------------
# Outputs — copy these after deployment
# ---------------------------------------------------------------------------
Outputs:
  ApiEndpoint:
    Description: Paste this URL into .env as REACT_APP_GLM_API_URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/run'
    Export:
      Name: LaplacianGLMApiEndpoint

  BucketName:
    Description: S3 bucket name — pass to prep_data.py --bucket
    Value: !Ref DataBucket
    Export:
      Name: LaplacianGLMBucket
